<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interview</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
    integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
    crossorigin="anonymous"></script>
  <style>
    :root {
      --ink: #000F1E;
      --paper: #FFFFFF;
      --soft: #464A4D;
      --label: #53575A;
      --mute: #656A6D;
      --line: #E3E8EC;
      --hi: #FFFF00;
      --bad: #B3261E;
      --pad: clamp(20px, 5vw, 56px);
      --ease: cubic-bezier(.16, 1, .3, 1);
      accent-color: var(--ink);
      color-scheme: light;
      font: 400 16px/2 "Archivo", "Noto Sans JP", system-ui, sans-serif;
      font-variant-numeric: tabular-nums;
      scrollbar-color: var(--mute) transparent;
      scrollbar-width: thin;
    }

    *,
    ::before,
    ::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    ::selection {
      background: var(--hi);
      color: var(--ink)
    }

    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px
    }

    :where(input, textarea) {
      caret-color: var(--ink)
    }

    ::-webkit-calendar-picker-indicator {
      filter: grayscale(1) contrast(0) brightness(.3)
    }

    :where(input, textarea, button) {
      font: inherit;
      color: inherit
    }

    fieldset {
      border: 0
    }

    body {
      color: var(--ink);
      background: var(--paper)
    }

    .turn {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100svh
    }

    .wrap {
      max-width: 1000px;
      margin-inline: auto;
      padding-inline: var(--pad)
    }

    /* ── the stage: one question, and nothing else ──────────────────────── */
    /* The interviewer's bar is 13px, a 32px control, 13px and a rule — 59px down to its
       first line. This band is built from those same numbers rather than a share of the
       window, so the two surfaces line up at whatever height they are opened side by
       side. Everything below stays this page's own scale. */
    .stage {
      position: relative;
      padding-block: 13px 0
    }

    .prog {
      position: absolute;
      inset-block-start: 0;
      inset-inline: 0;
      height: 3px;
      background: var(--line);

      i {
        display: block;
        width: var(--p, 0%);
        height: 100%;
        background: var(--hi)
      }
    }

    /* One status line, the way a breadcrumb is one line: where you are, how far in. */
    .status {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 46px;
      /* 32 + the 13 below it + the rule */
      padding-block-end: 13px;
      margin-block-end: clamp(26px, 4vh, 44px);
      border-block-end: 1px solid var(--line);
      font-weight: 500;
      font-size: 13px;
      line-height: 1;
      letter-spacing: .04em;
      color: var(--mute);

      i {
        width: 1px;
        height: 11px;
        background: var(--line)
      }

      .dim {
        color: var(--soft);
        letter-spacing: .01em
      }

      .count {
        margin-inline-start: auto;
        white-space: nowrap
      }

      &:has(.dim:empty) i {
        display: none
      }
    }

    .q {
      /* Focused only ever in code, to move the reader to the new question. */
      outline: 0;
      font-weight: 600;
      font-size: clamp(30px, 4.6vw, 52px);
      line-height: 1.16;
      letter-spacing: -.035em;
      max-width: 17em;
      text-wrap: pretty;
    }

    /* The shipped plan asks 70–235 Japanese characters, so the server counts them
       and names the tier; one clamp could not hold both ends. */
    [data-len=m] .q {
      font-size: clamp(25px, 3.2vw, 36px);
      line-height: 1.34;
      max-width: 23em
    }

    [data-len=l] .q {
      font-size: clamp(19px, 2vw, 24px);
      line-height: 1.62;
      max-width: 32em
    }

    /* Japanese sets without spaces, so the default is a break between any two characters:
       these headings were splitting 面接リンク ("interview link") down the middle as
       readily as breaking after a full stop. `auto-phrase` asks for phrase boundaries
       instead. Only the headings — it is meant for short display text, and it leaves
       body copy raggeder than it finds it. Where it is not supported nothing changes,
       which is today's behaviour. */
    html[lang=ja] .q {
      letter-spacing: -.012em;
      line-height: 1.3;
      word-break: auto-phrase
    }

    html[lang=ja] [data-len=m] .q {
      line-height: 1.45
    }

    /* A closing screen is one or two short sentences and nothing else on the page, so the
       lines can be evened out rather than filled — which lands the break on the full stop
       instead of partway through the last word. Questions keep `pretty`: they run long,
       and balancing a paragraph makes every line the same wrong length. */
    [data-done] .q {
      text-wrap: balance
    }

    html[lang=ja] [data-len=l] .q {
      letter-spacing: 0;
      line-height: 1.75
    }

    /* ── the desk: where they write ─────────────────────────────────────── */
    .desk {
      align-content: start;
      padding-block: clamp(30px, 5vh, 56px) clamp(48px, 9vh, 104px)
    }

    .field {
      max-width: 760px;
      border: 1px solid var(--line);
      background: var(--paper);
      transition: border-color 200ms var(--ease);

      &:focus-within {
        border-color: var(--ink)
      }

      /* the writing surface says it is live, under the box */
      &::after {
        content: "";
        display: block;
        height: 2px;
        background: var(--ink);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 280ms var(--ease);
      }

      &:focus-within::after {
        transform: scaleX(1)
      }
    }

    .field-body {
      padding: 18px clamp(16px, 2.6vw, 26px) 24px
    }

    .field-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-block-end: 14px;
      font-weight: 500;
      font-size: 13px;
      line-height: 1;
      letter-spacing: .04em;
      color: var(--label);
    }

    .req {
      padding: 4px 9px;
      box-shadow: inset 0 0 0 1px var(--line);
      color: var(--label);
      font-size: 12px;
      letter-spacing: .06em;
    }

    .hint {
      margin-block-end: 18px;
      max-width: 60ch;
      font-size: 15px;
      line-height: 1.85;
      color: var(--soft)
    }

    /* ── the nine widgets, as the inputs the browser already has ────────── */
    :where(textarea, .line) {
      display: block;
      width: 100%;
      border: 0;
      background: none;
      font-size: 17px;
      line-height: 2;
      outline: 0;
    }

    textarea {
      min-height: 7lh;
      resize: vertical
    }

    /* ── the application is sized to the window, not to a share of it ───── */
    /* It is one field and one button, and the button is the thing a first view has to
       contain. A fixed 44vh of writing surface pushed it past the fold on every window
       tall enough to matter, so the surface takes what is left over instead — the
       interviewer's desk fits itself to the window the same way.

       `height`, not `min-height`: a 1fr track only holds a shrinkable child to the window
       when the window is what sized the track. Under `min-height` the textarea kept the
       height its `rows` asks for and pushed the button out of the bottom.

       Only above 700px, because pinning the page to a shorter window than the field can
       honestly fit does not shrink the field — it lays the button on top of it. Under
       that the page flows and scrolls the way it always did. */
    [data-form=resume] textarea {
      min-height: 8lh
    }

    @media (height >=700px) {
      [data-form=resume] {
        height: 100svh
      }

      [data-form=resume] :is(.desk, .desk > .wrap, form, .field, .field-body) {
        display: grid;
        min-height: 0;
      }

      [data-form=resume] .desk {
        grid-template-rows: minmax(0, 1fr)
      }

      [data-form=resume] :is(.desk > .wrap, form, .field) {
        grid-template-rows: minmax(0, 1fr) auto
      }

      [data-form=resume] .field-body {
        grid-template-rows: auto auto minmax(0, 1fr)
      }

      /* A grid item stretches; this one is a button and wants to be its own width. */
      [data-form=resume] .send {
        justify-self: start
      }
    }

    ::placeholder {
      color: var(--mute);
      opacity: 1
    }

    .picks,
    .ranks {
      display: flex;
      flex-direction: column
    }

    .pick {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      padding-block: 7px;
      cursor: pointer;
      font-size: 17px;
      line-height: 1.6;

      input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0
      }

      i {
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        box-shadow: inset 0 0 0 1.5px var(--mute);
        transition: box-shadow 140ms, background 140ms;
      }

      i.radio {
        border-radius: 50%
      }

      &:hover i {
        box-shadow: inset 0 0 0 1.5px var(--ink)
      }

      :checked+i {
        background: var(--ink);
        box-shadow: inset 0 0 0 1.5px var(--ink)
      }

      :focus-visible+i {
        outline: 2px solid var(--ink);
        outline-offset: 3px
      }
    }

    .rating {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .cell {
      position: relative;
      cursor: pointer;

      input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0
      }

      span {
        display: grid;
        place-items: center;
        min-width: 54px;
        height: 54px;
        box-shadow: inset 0 0 0 1px var(--line);
        font-weight: 500;
        font-size: 17px;
        line-height: 1;
        transition: background 140ms, box-shadow 140ms;
      }

      &:hover span {
        box-shadow: inset 0 0 0 1px var(--ink)
      }

      :checked+span {
        background: var(--hi);
        box-shadow: inset 0 0 0 1px var(--ink)
      }

      :focus-visible+span {
        outline: 2px solid var(--ink);
        outline-offset: 3px
      }
    }

    .rank {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-block: 7px;
      font-size: 17px;
      line-height: 1.6;

      input[type=number] {
        flex: 0 0 56px;
        width: 56px;
        height: 40px;
        padding-inline: 10px;
        border: 1px solid var(--line);
        background: none;
        text-align: center;

        &:focus {
          border-color: var(--ink);
          outline: 0
        }
      }
    }

    /* ── send ───────────────────────────────────────────────────────────── */
    .send {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-block-start: 26px;
      border: 0;
      border-radius: 0;
      height: 60px;
      padding-inline: 30px;
      cursor: pointer;
      background: var(--hi);
      color: var(--ink);
      font-weight: 600;
      font-size: 16px;
      line-height: 1;
      letter-spacing: -.01em;
      transition: background 180ms var(--ease), color 180ms var(--ease);

      svg {
        transition: transform 260ms var(--ease)
      }

      &:hover {
        background: var(--ink);
        color: var(--hi)
      }

      &:hover svg {
        transform: translateX(5px)
      }

      &:active {
        background: var(--ink);
        color: var(--paper)
      }

      /* htmx disables it for the flight; the colour only says so */
      &:disabled {
        background: var(--line);
        color: var(--label);
        cursor: default
      }

      &:disabled svg {
        transform: none
      }
    }

    form.htmx-request .field {
      opacity: .6;
      pointer-events: none
    }

    .err {
      margin-block-start: 20px;
      max-width: 60ch;
      font-size: 15px;
      line-height: 1.7;
      color: var(--bad)
    }

    .err:empty {
      display: none
    }

    /* ── finished: the one screen that is all accent ────────────────────── */
    [data-done] {
      grid-template-rows: 1fr;

      .stage {
        display: grid;
        align-content: center;
        min-height: 100svh;
        padding-block: 0;
        background: var(--hi);
        color: var(--ink);
      }

      .q {
        font-size: clamp(32px, 5.6vw, 64px);
        line-height: 1.18;
        letter-spacing: -.035em;
        max-width: 15em
      }
    }

    html[lang=ja] [data-done] .q {
      line-height: 1.35;
      letter-spacing: -.012em
    }

    /* The one authored moment: the turn itself. The element is new on every swap,
       so the animation runs on arrival without anything being told to run it. */
    @media (prefers-reduced-motion: no-preference) {

      .status,
      .q {
        animation: rise 640ms var(--ease) both
      }

      .q {
        animation-delay: 70ms
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
          filter: blur(7px)
        }
      }
    }

    /* A phone is where most of these get answered, and the one place the viewport
       cannot lend the type any size. */
    @media (width <=720px) {
      .stage {
        padding-block: 26px 0
      }

      .q {
        font-size: 33px
      }

      [data-len=m] .q {
        font-size: 28px
      }

      [data-len=l] .q {
        font-size: 23px
      }

      [data-done] .q {
        font-size: 36px
      }

      .status {
        font-size: 13px;
        gap: 11px
      }

      .field-body {
        padding: 18px 16px 22px
      }

      textarea {
        min-height: 5lh
      }

      .send {
        width: 100%;
        justify-content: space-between;
        height: 58px
      }
    }

    @media (width <=400px) {
      .q {
        font-size: 30px
      }

      [data-len=m] .q {
        font-size: 26px
      }

      [data-len=l] .q {
        font-size: 22px
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body>
  <!--turn-->

  <script>
    // The only thing markup cannot do for itself. The signed state is the whole
    // interview and the server keeps none of it (ADR-0004); it outgrows a cookie by
    // the third long answer, so the browser holds it and hands it back on a reload.
    (() => {
      const KEY = "interview.state";
      const token = new URLSearchParams(location.search).get("t") || "";

      addEventListener("htmx:afterSwap", () => {
        document.querySelector(".q")?.focus();   // the turn changed; say so
        const held = document.querySelector("[name=state]");
        try {
          held ? localStorage.setItem(KEY, JSON.stringify({t: token, state: held.value}))
            : localStorage.removeItem(KEY);
        } catch { }
      });

      if (!token) return;
      let saved = null;
      try {saved = JSON.parse(localStorage.getItem(KEY) || "null");} catch { }
      if (saved && saved.t === token && saved.state) {
        htmx.ajax("POST", "/turn", {target: "#turn", swap: "outerHTML", values: {state: saved.state}});
      }
    })();
  </script>
</body>

</html>
